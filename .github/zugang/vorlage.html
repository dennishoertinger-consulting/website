<!doctype html>
<html class="staticrypt-html" lang="de">
    <head>
        <meta charset="utf-8" />
        <title>/*[|template_title|]*/0</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <!-- Zugangscode-Seite (StatiCrypt). Der Seiteninhalt ist verschlüsselt und wird erst mit dem Code im Browser lesbar. -->
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f2f2f7;
                --surface: #ffffff;
                --label: #000000;
                --label2: #6e6e73;
                --outline: #86868b;
                --btn-bg: #000000;
                --btn-fg: #ffffff;
                --btn-hover: #3a3a3c;
                --error: #d70015;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #000000;
                    --surface: #1c1c1e;
                    --label: #ffffff;
                    --label2: #8e8e93;
                    --outline: #8e8e93;
                    --btn-bg: #ffffff;
                    --btn-fg: #000000;
                    --btn-hover: #d1d1d6;
                    --error: #ff6961;
                }
            }
            * { box-sizing: border-box; margin: 0; }
            html, body { height: 100%; }
            body {
                background: var(--bg);
                color: var(--label);
                font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            .hidden { display: none !important; }
            .page {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px 20px;
            }
            .box { width: 100%; max-width: 440px; }
            .name { font-size: 15px; font-weight: 600; color: var(--label2); }
            h1 { margin-top: 24px; font-size: 40px; line-height: 46px; font-weight: 700; letter-spacing: -0.02em; }
            .lead { margin-top: 8px; font-size: 19px; line-height: 28px; color: var(--label2); }
            form { margin-top: 32px; display: grid; gap: 12px; }
            input[type='password'] {
                height: 52px;
                padding: 0 20px;
                border-radius: 999px;
                border: 1.5px solid var(--outline);
                background: var(--surface);
                color: var(--label);
                font: inherit;
                font-size: 17px;
            }
            input[type='password']:focus-visible { outline: 2px solid var(--label); outline-offset: 2px; }
            input[aria-invalid='true'] { border-color: var(--error); }
            .error { font-size: 15px; color: var(--error); }
            button {
                height: 52px;
                border: 0;
                border-radius: 999px;
                background: var(--btn-bg);
                color: var(--btn-fg);
                font: inherit;
                font-size: 17px;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 200ms cubic-bezier(0.22, 0.61, 0.36, 1);
            }
            @media (hover: hover) { button:hover { background: var(--btn-hover); } }
            .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
            @media (min-width: 900px) {
                h1 { font-size: 56px; line-height: 62px; font-weight: 800; }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="page"></div>

        <div id="staticrypt_content" class="page hidden">
            <main class="box">
                <p class="name">Dennis Hörtinger</p>
                <h1>/*[|template_title|]*/0</h1>
                <p class="lead">/*[|template_instructions|]*/0</p>
                <form id="staticrypt-form" action="#" method="post">
                    <label for="staticrypt-password" class="sr-only">/*[|template_placeholder|]*/0</label>
                    <input
                        id="staticrypt-password"
                        type="password"
                        name="password"
                        placeholder="/*[|template_placeholder|]*/0"
                        autocomplete="current-password"
                        aria-describedby="staticrypt-error"
                        required
                    />
                    <p id="staticrypt-error" class="error hidden" role="alert">/*[|template_error|]*/0</p>
                    <button type="submit">/*[|template_button|]*/0</button>
                </form>
            </main>
        </div>

        <script>
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // Entschlüsseln geht nur in einer sicheren Verbindung (https). Über http fehlt crypto.subtle.
            const sicher = !!(window.crypto && window.crypto.subtle);
            const httpsHinweis = "Diese Seite lässt sich nur über eine sichere Verbindung öffnen. Bitte die Adresse mit https:// aufrufen.";

            function zeigeFehler(text) {
                const input = document.getElementById("staticrypt-password");
                const fehler = document.getElementById("staticrypt-error");
                if (text) fehler.textContent = text;
                input.setAttribute("aria-invalid", "true");
                fehler.classList.remove("hidden");
                input.select();
            }

            // Mit gespeichertem Code direkt entschlüsseln, sonst Eingabe zeigen
            window.onload = async function () {
                let isSuccessful = false;
                if (sicher) {
                    try {
                        ({ isSuccessful } = await staticrypt.handleDecryptOnLoad());
                    } catch (e) {}
                }
                if (!isSuccessful) {
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();
                    if (!sicher) zeigeFehler(httpsHinweis);
                }
            };

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                const input = document.getElementById("staticrypt-password");
                if (!sicher) return zeigeFehler(httpsHinweis);
                // Code immer merken (Dauer über --remember), damit er nicht auf jeder Seite neu nötig ist
                let isSuccessful = false;
                try {
                    ({ isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, isRememberEnabled));
                } catch (e) {}
                if (!isSuccessful) zeigeFehler();
            });
        </script>
    </body>
</html>
