<!doctype html>
<html class="staticrypt-html" lang="de">
    <head>
        <meta charset="utf-8" />
        <title>/*[|template_title|]*/0</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <!-- Zugangscode-Seite (StatiCrypt). Der Seiteninhalt ist verschlüsselt und wird erst mit dem Code im Browser lesbar. -->
        <style>
            /* CI V13: Eisgrau, weiße Fläche, Schwarz; Night nach Systemeinstellung. Schrift Geist, selbst gehostet. */
            @font-face { font-family: 'Geist'; src: url('/assets/fonts/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
            @font-face { font-family: 'Geist'; src: url('/assets/fonts/Geist-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
            @font-face { font-family: 'Geist'; src: url('/assets/fonts/Geist-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
            @font-face { font-family: 'Geist Mono'; src: url('/assets/fonts/GeistMono-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
            :root {
                color-scheme: light dark;
                --grund: #EFF2F5;
                --flaeche: #FFFFFF;
                --text: #000000;
                --schiefer: #56606B;
                --linie: #D9DEE4;
                --btn-bg: #000000;
                --btn-fg: #FFFFFF;
                --blau: #0000FF;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --grund: #0F1214;
                    --flaeche: #000000;
                    --text: #FFFFFF;
                    --schiefer: #939BA4;
                    --linie: #22272C;
                    --btn-bg: #FFFFFF;
                    --btn-fg: #000000;
                }
            }
            * { box-sizing: border-box; margin: 0; }
            html, body { height: 100%; }
            body {
                background: var(--grund);
                color: var(--text);
                font-family: 'Geist', 'Helvetica Neue', Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            .hidden { display: none !important; }
            .page {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px 12px;
            }
            .box { width: 100%; max-width: 480px; background: var(--flaeche); border-radius: 12px; padding: 40px 24px 24px; }
            .name { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
            h1 { margin-top: 32px; font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em; }
            .lead { margin-top: 12px; font-size: 17px; line-height: 1.55; color: var(--schiefer); }
            form { margin-top: 32px; display: grid; gap: 12px; }
            input[type='password'] {
                height: 48px;
                padding: 0 16px;
                border-radius: 10px;
                border: 0;
                background: var(--grund);
                color: var(--text);
                font: inherit;
                font-size: 16px;
            }
            input[type='password']::placeholder { color: var(--schiefer); }
            input[type='password']:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
            input[aria-invalid='true'] { outline: 2px solid var(--text); }
            .error { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: var(--text); }
            button {
                height: 48px;
                border: 0;
                border-radius: 10px;
                background: var(--btn-bg);
                color: var(--btn-fg);
                font: inherit;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
            }
            button::after {
                content: '';
                display: inline-block;
                width: 0.49em;
                height: 0.114em;
                margin-left: 0.08em;
                vertical-align: -0.162em;
                background: var(--blau);
                opacity: 0;
                transition: opacity 0.15s;
            }
            button:hover::after, button:focus-visible::after { opacity: 1; }
            button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
            .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
            @media (min-width: 900px) {
                .box { padding: 64px; }
                h1 { font-size: 56px; }
            }
            @media (prefers-reduced-motion: reduce) { button::after { transition: none; } }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="page"></div>

        <div id="staticrypt_content" class="page hidden">
            <main class="box">
                <p class="name">Dennis Hörtinger</p>
                <h1>/*[|template_title|]*/0</h1>
                <p class="lead">/*[|template_instructions|]*/0</p>
                <form id="staticrypt-form" action="#" method="post">
                    <label for="staticrypt-password" class="sr-only">/*[|template_placeholder|]*/0</label>
                    <input
                        id="staticrypt-password"
                        type="password"
                        name="password"
                        placeholder="/*[|template_placeholder|]*/0"
                        autocomplete="current-password"
                        aria-describedby="staticrypt-error"
                        required
                    />
                    <p id="staticrypt-error" class="error hidden" role="alert">/*[|template_error|]*/0</p>
                    <button type="submit">/*[|template_button|]*/0</button>
                </form>
            </main>
        </div>

        <script>
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // Entschlüsseln geht nur in einer sicheren Verbindung (https). Über http fehlt crypto.subtle.
            const sicher = !!(window.crypto && window.crypto.subtle);
            const httpsHinweis = "Diese Seite lässt sich nur über eine sichere Verbindung öffnen. Bitte die Adresse mit https:// aufrufen.";

            function zeigeFehler(text) {
                const input = document.getElementById("staticrypt-password");
                const fehler = document.getElementById("staticrypt-error");
                if (text) fehler.textContent = text;
                input.setAttribute("aria-invalid", "true");
                fehler.classList.remove("hidden");
                input.select();
            }

            // Mit gespeichertem Code direkt entschlüsseln, sonst Eingabe zeigen
            window.onload = async function () {
                let isSuccessful = false;
                if (sicher) {
                    try {
                        ({ isSuccessful } = await staticrypt.handleDecryptOnLoad());
                    } catch (e) {}
                }
                if (!isSuccessful) {
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();
                    if (!sicher) zeigeFehler(httpsHinweis);
                }
            };

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                const input = document.getElementById("staticrypt-password");
                if (!sicher) return zeigeFehler(httpsHinweis);
                // Code immer merken (Dauer über --remember), damit er nicht auf jeder Seite neu nötig ist
                let isSuccessful = false;
                try {
                    ({ isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, isRememberEnabled));
                } catch (e) {}
                if (!isSuccessful) zeigeFehler();
            });
        </script>
    </body>
</html>
