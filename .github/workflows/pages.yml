name: Veröffentlichen (GitHub Pages)

# Veröffentlicht die Website bei jedem Push auf main auf GitHub Pages.
# Im Repo bleibt alles reines HTML/CSS/JS; verschlüsselt wird nur die veröffentlichte Kopie.
#
# Einmalig einstellen:
#   Settings → Pages → Source: „GitHub Actions“, Custom domain: www.hoertinger.de, Enforce HTTPS
#   Settings → Secrets and variables → Actions → Repository secret ZUGANGSCODE (mind. 8 Zeichen)
#   Fehlt der Code, bricht der Lauf ab. Zum Livegang: Variable OHNE_ZUGANGSCODE=ja setzen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Seite zusammenstellen
        run: rsync -a --exclude '.git' --exclude '.github' --exclude 'CLAUDE.md' --exclude 'README.md' --exclude '.gitignore' ./ _site/

      - name: Sicherheitsregeln einfügen (Seiten)
        run: node .github/zugang/sicherheit.mjs

      - name: Mit Zugangscode verschlüsseln
        run: node .github/zugang/verschluesseln.mjs
        env:
          ZUGANGSCODE: ${{ secrets.ZUGANGSCODE }}
          OHNE_ZUGANGSCODE: ${{ vars.OHNE_ZUGANGSCODE }}

      - name: Sicherheitsregeln einfügen (Code-Seite)
        run: node .github/zugang/sicherheit.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
